server:
  port: 8080

spring:
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password: sa

  jpa:
    hibernate:
      ddl-auto: create
    show_sql: true
    open-in-view: false  # par defaut les db connections restent ouvertes pendant TOUT!  le traitement de la requete

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml;

decorator: 
  datasource:
    flexy-pool:
      threshold: 
        connection:
          acquire: -1
          lease: 0